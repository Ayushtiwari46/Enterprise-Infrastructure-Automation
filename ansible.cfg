# ==============================================================================
# ENTERPRISE INFRASTRUCTURE AUTOMATION - ANSIBLE CONFIGURATION
# ==============================================================================
# Environment: Multi-Platform Enterprise L3 Infrastructure & Lab
# Target: Linux, AIX, Windows, VMware, OLVM, KVM, Storage, SAN, Clusters
# ==============================================================================

[defaults]
# Inventory search paths (Default to active lab inventory)
inventory = inventories/lab/hosts.yml

# Roles and Collections search paths
roles_path = roles:/usr/share/ansible/roles:/etc/ansible/roles
collections_path = dependencies/galaxy-collections:/root/.ansible/collections:/usr/share/ansible/collections

# Remote connection & execution safety
remote_user = root
host_key_checking = False
retry_files_enabled = False
gathering = smart
fact_caching = jsonfile
fact_caching_connection = logs/facts
fact_caching_timeout = 86400

# Performance & scaling
forks = 20
timeout = 30
poll_interval = 5

# Central logging
log_path = logs/execution/ansible.log

# Python interpreter detection
interpreter_python = auto_silent

# Execution callbacks and timing profiling
stdout_callback = default
callbacks_enabled = timer, profile_tasks

# Deprecation and warning controls
deprecation_warnings = False
command_warnings = False

# Module default paths
local_tmp = ~/.ansible/tmp
remote_tmp = ~/.ansible/tmp

[privilege_escalation]
become = True
become_method = sudo
become_user = root
become_ask_pass = False

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o PreferredAuthentications=publickey,password
control_path = %(directory)s/ansible-ssh-%%h-%%p-%%r
transfer_method = smart

[persistent_connection]
connect_timeout = 30
command_timeout = 30
