---
# ==============================================================================
# PLAYBOOK: san_brocade_port_health.yml
# ==============================================================================
# Operational Category: Performance Reports
# Safety Classification: PERFORMANCE_COLLECTION
# Supported Platforms: Brocade Fabric OS (FOS 8.x, 9.x)
# Verified Modules (FQCN):
#   - ansible.builtin.command
#   - ansible.builtin.file
#   - ansible.builtin.copy
#   - ansible.builtin.debug
# ==============================================================================

- name: Brocade Fibre Channel Port Health, Optical SFP Power, and CRC Error Audit
  hosts: brocade_san:mock_san
  gather_facts: false
  vars_files:
    - ../../../vars/global.yml
    - ../../../vars/networking/brocade.yml

  vars:
    switch_ip: "{{ ansible_host | default('10.100.85.11') }}"
    switch_user: "{{ san_user | default('admin') }}"

  tasks:
    - name: 1. Query Port Error Statistics (porterrshow)
      ansible.builtin.command:
        cmd: "ssh -o StrictHostKeyChecking=no -p {{ brocade_ssh_port }} {{ switch_user }}@{{ switch_ip }} porterrshow"
      register: brocade_porterr
      changed_when: false
      failed_when: false

    - name: 2. Query SFP Transceiver Optical TX/RX Power (sfpshow)
      ansible.builtin.command:
        cmd: "ssh -o StrictHostKeyChecking=no -p {{ brocade_ssh_port }} {{ switch_user }}@{{ switch_ip }} sfpshow"
      register: brocade_sfpshow
      changed_when: false
      failed_when: false

    - name: 3. Ensure Controller Report Directory Exists
      ansible.builtin.file:
        path: "{{ playbook_dir }}/../../../reports/performance/{{ inventory_hostname }}"
        state: directory
        mode: '0755'
      delegate_to: localhost

    - name: 4. Save Brocade Port Health Artifact
      ansible.builtin.copy:
        content: |
          === BROCADE FC PORT HEALTH & OPTICAL POWER AUDIT: {{ inventory_hostname }} ===
          
          --- PORT ERROR COUNTERS (porterrshow) ---
          {{ brocade_porterr.stdout | default('porterrshow query unavailable or mock environment') }}
          
          --- SFP OPTICAL TRANSCEIVER READINGS (sfpshow) ---
          {{ brocade_sfpshow.stdout | default('sfpshow query unavailable') }}
        dest: "{{ playbook_dir }}/../../../reports/performance/{{ inventory_hostname }}/brocade_port_health.txt"
        mode: '0644'
      delegate_to: localhost

    - name: 5. Display Port Health Audit Status
      ansible.builtin.debug:
        msg: "Brocade port error and SFP health audit complete for {{ inventory_hostname }}."
