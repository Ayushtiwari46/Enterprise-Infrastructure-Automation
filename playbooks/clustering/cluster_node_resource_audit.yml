---
# ==============================================================================
# PLAYBOOK: cluster_node_resource_audit.yml
# ==============================================================================
# Operational Category: Health Checks
# Safety Classification: READ_ONLY
# Supported Platforms: Multi-Platform (Pacemaker/Corosync, PowerHA, GPFS, VCS)
# Verified Modules (FQCN):
#   - ansible.builtin.setup
#   - ansible.builtin.command
#   - ansible.builtin.file
#   - ansible.builtin.copy
#   - ansible.builtin.debug
# ==============================================================================

- name: Cross-Platform Cluster Quorum, Fencing Mechanism, and Virtual IP Audit
  hosts: clustering_enterprise:mock_targets
  gather_facts: false
  vars_files:
    - ../../vars/global.yml

  tasks:
    - name: 1. Gather Minimal Network and System Facts
      ansible.builtin.setup:
        gather_subset:
          - '!all'
          - 'min'
          - 'network'

    - name: 2. Query Pacemaker / Corosync Cluster Status (pcs status / crm_mon)
      ansible.builtin.command:
        cmd: crm_mon -1
      register: pacemaker_status
      changed_when: false
      failed_when: false

    - name: 3. Query Virtual IP (VIP) Allocation on Network Interfaces
      ansible.builtin.command:
        cmd: ip -o addr show
      register: ip_addrs_raw
      changed_when: false
      failed_when: false

    - name: 4. Ensure Controller Audit Directory Exists
      ansible.builtin.file:
        path: "{{ playbook_dir }}/../../reports/health-checks/{{ inventory_hostname }}"
        state: directory
        mode: '0755'
      delegate_to: localhost

    - name: 5. Save Cluster Node Audit Artifact
      ansible.builtin.copy:
        content: |
          === CLUSTER NODE & RESOURCE AUDIT: {{ inventory_hostname }} ===
          
          --- PACEMAKER / COROSYNC STATUS (crm_mon) ---
          {{ pacemaker_status.stdout | default('Pacemaker / crm_mon not active or mock environment') }}
          
          --- NETWORK INTERFACES & CONFIGURED VIPs ---
          {{ ip_addrs_raw.stdout | default('N/A') }}
        dest: "{{ playbook_dir }}/../../reports/health-checks/{{ inventory_hostname }}/cluster_node_audit.txt"
        mode: '0644'
      delegate_to: localhost

    - name: 6. Display Cluster Node Audit Status
      ansible.builtin.debug:
        msg: "Cluster node resource audit complete for {{ inventory_hostname }}."
