---
# ==============================================================================
# PLAYBOOK: windows_server_health_check.yml
# ==============================================================================
# Operational Category: Health Checks
# Safety Classification: READ_ONLY
# Supported OS: Windows Server 2012 R2, 2016, 2019, 2022, 2025
# Verified Modules (FQCN):
#   - ansible.windows.win_shell
#   - ansible.windows.win_command
#   - ansible.builtin.file
#   - ansible.builtin.copy
#   - ansible.builtin.debug
# ==============================================================================

- name: Microsoft Windows Server Health and Uptime Audit
  hosts: windows_enterprise:mock_windows
  gather_facts: false
  vars_files:
    - ../../vars/global.yml
    - ../../vars/windows.yml

  tasks:
    - name: 1. Query Windows OS Version, Build, and Uptime via PowerShell
      ansible.windows.win_shell: |
        $os = Get-CimInstance Win32_OperatingSystem
        $cs = Get-CimInstance Win32_ComputerSystem
        $uptime = (Get-Date) - $os.LastBootUpTime
        [PSCustomObject]@{
            OSName = $os.Caption
            Version = $os.Version
            BuildNumber = $os.BuildNumber
            LastBootUpTime = $os.LastBootUpTime
            UptimeDays = [math]::Round($uptime.TotalDays, 1)
            TotalMemoryGB = [math]::Round($cs.TotalPhysicalMemory / 1GB, 2)
            FreeMemoryGB = [math]::Round($os.FreePhysicalMemory / 1MB, 2)
        } | ConvertTo-Json
      register: win_os_info
      changed_when: false

    - name: 2. Query Pending Reboot Status (CBS, WindowsUpdate, PendingFileRenameOperations)
      ansible.windows.win_shell: |
        $rebootPending = @()
        if (Test-Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Component Based Servicing\RebootPending') { $rebootPending += 'CBS' }
        if (Test-Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\WindowsUpdate\Auto Update\RebootRequired') { $rebootPending += 'WindowsUpdate' }
        if (Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager' -Name PendingFileRenameOperations -ErrorAction SilentlyContinue) { $rebootPending += 'SessionManager' }
        [PSCustomObject]@{
            RebootPending = ($rebootPending.Count -gt 0)
            Triggers = $rebootPending
        } | ConvertTo-Json
      register: win_reboot_status
      changed_when: false

    - name: 3. Query Recent Bugchecks and System Crashes (BSOD Event ID 1001)
      ansible.windows.win_shell: |
        Get-WinEvent -FilterHashtable @{LogName='System'; ProviderName='Microsoft-Windows-WER-SystemErrorReporting'; Id=1001} -MaxEvents 5 -ErrorAction SilentlyContinue |
            Select-Object TimeCreated, Message | ConvertTo-Json
      register: win_bugchecks
      changed_when: false

    - name: 4. Ensure Controller Health Report Directory Exists
      ansible.builtin.file:
        path: "{{ playbook_dir }}/../../reports/health-checks/{{ inventory_hostname }}"
        state: directory
        mode: '0755'
      delegate_to: localhost

    - name: 5. Save Windows Health Audit Artifact
      ansible.builtin.copy:
        content: |
          === WINDOWS SERVER HEALTH REPORT: {{ inventory_hostname }} ===
          
          --- OPERATING SYSTEM & MEMORY ---
          {{ win_os_info.stdout }}
          
          --- PENDING REBOOT AUDIT ---
          {{ win_reboot_status.stdout }}
          
          --- RECENT BSOD BUGCHECK TELEMETRY ---
          {{ win_bugchecks.stdout | default('No recent bugcheck events logged in System event log.') }}
        dest: "{{ playbook_dir }}/../../reports/health-checks/{{ inventory_hostname }}/windows_health_report.txt"
        mode: '0644'
      delegate_to: localhost

    - name: 6. Display Windows Server Health Status
      ansible.builtin.debug:
        msg: "Windows Host {{ inventory_hostname }}: Health check complete. Pending reboot: {{ win_reboot_status.stdout }}"
