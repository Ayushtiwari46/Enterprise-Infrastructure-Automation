---
# ==============================================================================
# PLAYBOOK: windows_disk_network_inventory.yml
# ==============================================================================
# Operational Category: Configuration Audits
# Safety Classification: CONFIGURATION_AUDIT
# Supported OS: Windows Server 2012 R2, 2016, 2019, 2022, 2025
# Verified Modules (FQCN):
#   - ansible.windows.win_shell
#   - ansible.builtin.file
#   - ansible.builtin.copy
#   - ansible.builtin.debug
# ==============================================================================

- name: Microsoft Windows Storage Volumes, VSS, and Network Stack Inventory
  hosts: windows_enterprise:mock_windows
  gather_facts: false
  vars_files:
    - ../../vars/global.yml
    - ../../vars/windows.yml

  tasks:
    - name: 1. Query Logical Volumes, Filesystems (NTFS/ReFS), and Free Space
      ansible.windows.win_shell: |
        Get-Volume | Where-Object { $_.DriveLetter -ne $null } |
            Select-Object DriveLetter, FileSystemLabel, FileSystem, @{N='SizeGB';E={[math]::Round($_.Size/1GB,1)}}, @{N='FreeGB';E={[math]::Round($_.SizeRemaining/1GB,1)}}, @{N='FreePct';E={[math]::Round(($_.SizeRemaining/$_.Size)*100,1)}} | ConvertTo-Json
      register: win_volumes
      changed_when: false

    - name: 2. Query Volume Shadow Copy (VSS) Allocation and Storage
      ansible.windows.win_shell: |
        vssadmin list shadowstorage
      register: vss_storage
      changed_when: false
      failed_when: false

    - name: 3. Query Network Adapters, IP Addressing, and Link Speed
      ansible.windows.win_shell: |
        Get-NetAdapter | Select-Object Name, InterfaceDescription, Status, LinkSpeed, MacAddress | ConvertTo-Json
      register: win_adapters
      changed_when: false

    - name: 4. Query NIC Teaming and LBFO Configuration
      ansible.windows.win_shell: |
        Get-NetLbfoTeam -ErrorAction SilentlyContinue | Select-Object Name, Members, TeamingMode, LoadBalancingAlgorithm, Status | ConvertTo-Json
      register: win_nic_team
      changed_when: false
      failed_when: false

    - name: 5. Query Active SMB Network Shares
      ansible.windows.win_shell: |
        Get-SmbShare | Select-Object Name, Path, Description | ConvertTo-Json
      register: win_smb_shares
      changed_when: false

    - name: 6. Ensure Controller Audit Directory Exists
      ansible.builtin.file:
        path: "{{ playbook_dir }}/../../reports/configuration-audits/{{ inventory_hostname }}"
        state: directory
        mode: '0755'
      delegate_to: localhost

    - name: 7. Save Windows Storage and Network Inventory Artifact
      ansible.builtin.copy:
        content: |
          === WINDOWS DISK & NETWORK INVENTORY: {{ inventory_hostname }} ===
          
          --- LOGICAL VOLUMES (NTFS / ReFS) ---
          {{ win_volumes.stdout }}
          
          --- VSS SHADOW COPY STORAGE ALLOCATION ---
          {{ vss_storage.stdout | default('vssadmin query unavailable') }}
          
          --- PHYSICAL & VIRTUAL NETWORK ADAPTERS ---
          {{ win_adapters.stdout }}
          
          --- NIC TEAMING (LBFO) CONFIGURATION ---
          {{ win_nic_team.stdout | default('No LBFO NIC teams configured') }}
          
          --- SMB NETWORK SHARES ---
          {{ win_smb_shares.stdout }}
        dest: "{{ playbook_dir }}/../../reports/configuration-audits/{{ inventory_hostname }}/windows_disk_network_inventory.txt"
        mode: '0644'
      delegate_to: localhost

    - name: 8. Display Windows Disk & Network Status
      ansible.builtin.debug:
        msg: "Windows Host {{ inventory_hostname }}: Storage volumes and network topology inventory complete."
