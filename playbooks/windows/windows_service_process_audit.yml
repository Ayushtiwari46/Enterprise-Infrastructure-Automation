---
# ==============================================================================
# PLAYBOOK: windows_service_process_audit.yml
# ==============================================================================
# Operational Category: Health Checks
# Safety Classification: READ_ONLY
# Supported OS: Windows Server 2012 R2, 2016, 2019, 2022, 2025
# Verified Modules (FQCN):
#   - ansible.windows.win_shell
#   - ansible.windows.win_service_info
#   - ansible.builtin.file
#   - ansible.builtin.copy
#   - ansible.builtin.debug
# ==============================================================================

- name: Microsoft Windows Services and Process Saturation Audit
  hosts: windows_enterprise:mock_windows
  gather_facts: false
  vars_files:
    - ../../vars/global.yml
    - ../../vars/windows.yml

  tasks:
    - name: 1. Audit Automatic Services in Stopped State
      ansible.windows.win_shell: |
        Get-CimInstance Win32_Service | Where-Object { $_.StartMode -eq 'Auto' -and $_.State -ne 'Running' } |
            Select-Object Name, DisplayName, State, StartMode, PathName | ConvertTo-Json
      register: stopped_auto_services
      changed_when: false

    - name: 2. Audit Top 15 Memory Consuming Processes (Working Set)
      ansible.windows.win_shell: |
        Get-Process | Sort-Object -Property WorkingSet64 -Descending | Select-Object -First 15 Name, Id, @{N='WS_MB';E={[math]::Round($_.WorkingSet64/1MB,1)}}, @{N='CPU_Sec';E={[math]::Round($_.CPU,1)}}, Handles | ConvertTo-Json
      register: top_mem_processes
      changed_when: false

    - name: 3. Audit Top 15 Handle and Thread Leaks
      ansible.windows.win_shell: |
        Get-Process | Sort-Object -Property Handles -Descending | Select-Object -First 10 Name, Id, Handles, @{N='Threads';E={$_.Threads.Count}} | ConvertTo-Json
      register: top_handle_processes
      changed_when: false

    - name: 4. Ensure Controller Audit Directory Exists
      ansible.builtin.file:
        path: "{{ playbook_dir }}/../../reports/health-checks/{{ inventory_hostname }}"
        state: directory
        mode: '0755'
      delegate_to: localhost

    - name: 5. Save Windows Services and Process Artifact
      ansible.builtin.copy:
        content: |
          === WINDOWS SERVICES & PROCESS CONSUMPTION: {{ inventory_hostname }} ===
          
          --- STOPPED AUTOMATIC SERVICES ---
          {{ stopped_auto_services.stdout | default('None - All automatic services running.') }}
          
          --- TOP 15 MEMORY CONSUMERS ---
          {{ top_mem_processes.stdout }}
          
          --- TOP HANDLE AND THREAD CONSUMERS ---
          {{ top_handle_processes.stdout }}
        dest: "{{ playbook_dir }}/../../reports/health-checks/{{ inventory_hostname }}/windows_service_process_audit.txt"
        mode: '0644'
      delegate_to: localhost

    - name: 6. Display Service Status Summary
      ansible.builtin.debug:
        msg: "Windows Host {{ inventory_hostname }}: Service and process saturation audit complete."
