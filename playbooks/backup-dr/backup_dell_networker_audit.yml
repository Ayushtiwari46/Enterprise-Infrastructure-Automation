---
# ==============================================================================
# PLAYBOOK: backup_dell_networker_audit.yml
# ==============================================================================
# Operational Category: Health Checks
# Safety Classification: READ_ONLY
# Supported Platforms: Dell EMC NetWorker Client 19.x+
# Verified Modules (FQCN):
#   - ansible.builtin.command
#   - ansible.builtin.file
#   - ansible.builtin.copy
#   - ansible.builtin.debug
# ==============================================================================

- name: Dell EMC NetWorker Client Daemon (nsrexecd) and Server Session Audit
  hosts: networker_nodes:mock_targets
  gather_facts: false
  vars_files:
    - ../../vars/global.yml
    - ../../vars/backup/networker.yml

  tasks:
    - name: 1. Query NetWorker Client Daemon Status (nsrexecd)
      ansible.builtin.command:
        cmd: pgrep -fl nsrexecd
      register: nsr_proc_raw
      changed_when: false
      failed_when: false

    - name: 2. Query Configured NetWorker Backup Server (/nsr/res/servers)
      ansible.builtin.command:
        cmd: cat /nsr/res/servers
      register: nsr_servers_raw
      changed_when: false
      failed_when: false

    - name: 3. Ensure Controller Audit Directory Exists
      ansible.builtin.file:
        path: "{{ playbook_dir }}/../../reports/health-checks/{{ inventory_hostname }}"
        state: directory
        mode: '0755'
      delegate_to: localhost

    - name: 4. Save NetWorker Audit Artifact
      ansible.builtin.copy:
        content: |
          === DELL EMC NETWORKER CLIENT AUDIT: {{ inventory_hostname }} ===
          
          --- NSREXECD DAEMON PROCESSES ---
          {{ nsr_proc_raw.stdout | default('No active nsrexecd process found or mock environment') }}
          
          --- AUTHORIZED BACKUP SERVERS (/nsr/res/servers) ---
          {{ nsr_servers_raw.stdout | default('/nsr/res/servers configuration file absent') }}
        dest: "{{ playbook_dir }}/../../reports/health-checks/{{ inventory_hostname }}/networker_audit.txt"
        mode: '0644'
      delegate_to: localhost

    - name: 5. Display NetWorker Status Summary
      ansible.builtin.debug:
        msg: "NetWorker client audit complete for {{ inventory_hostname }}."
