---
# ==============================================================================
# PLAYBOOK: backup_veritas_netbackup_audit.yml
# ==============================================================================
# Operational Category: Health Checks
# Safety Classification: READ_ONLY
# Supported Platforms: Veritas NetBackup Client 8.x, 9.x, 10.x
# Verified Modules (FQCN):
#   - ansible.builtin.command
#   - ansible.builtin.file
#   - ansible.builtin.copy
#   - ansible.builtin.debug
# ==============================================================================

- name: Veritas NetBackup Client Daemon, Certificate, and Connectivity Audit
  hosts: netbackup_nodes:mock_targets
  gather_facts: false
  vars_files:
    - ../../vars/global.yml
    - ../../vars/backup/netbackup.yml

  tasks:
    - name: 1. Query NetBackup Client Running Daemons (bpps)
      ansible.builtin.command:
        cmd: "{{ nbu_openv_bin }}/bpps -a"
      register: nbu_bpps_raw
      changed_when: false
      failed_when: false

    - name: 2. Query Client Communication and Master Server Connectivity (bpclntcmd -pn)
      ansible.builtin.command:
        cmd: "{{ nbu_bpclntcmd_bin }} -pn"
      register: nbu_bpclntcmd_pn
      changed_when: false
      failed_when: false

    - name: 3. Query Client Security Certificates (nbcertcmd -checkCert)
      ansible.builtin.command:
        cmd: "{{ nbu_openv_bin }}/nbcertcmd -checkCert"
      register: nbu_cert_check
      changed_when: false
      failed_when: false

    - name: 4. Ensure Controller Audit Directory Exists
      ansible.builtin.file:
        path: "{{ playbook_dir }}/../../reports/health-checks/{{ inventory_hostname }}"
        state: directory
        mode: '0755'
      delegate_to: localhost

    - name: 5. Save NetBackup Audit Artifact
      ansible.builtin.copy:
        content: |
          === VERITAS NETBACKUP CLIENT AUDIT: {{ inventory_hostname }} ===
          
          --- RUNNING NETBACKUP PROCESSES (bpps) ---
          {{ nbu_bpps_raw.stdout | default('NetBackup daemons query unavailable or mock environment') }}
          
          --- MASTER SERVER REACHABILITY (bpclntcmd -pn) ---
          {{ nbu_bpclntcmd_pn.stdout | default('bpclntcmd unavailable') }}
          
          --- CLIENT SECURITY CERTIFICATE STATUS ---
          {{ nbu_cert_check.stdout | default('nbcertcmd unavailable') }}
        dest: "{{ playbook_dir }}/../../reports/health-checks/{{ inventory_hostname }}/netbackup_audit.txt"
        mode: '0644'
      delegate_to: localhost

    - name: 6. Display NetBackup Status Summary
      ansible.builtin.debug:
        msg: "NetBackup audit complete for client {{ inventory_hostname }}."
