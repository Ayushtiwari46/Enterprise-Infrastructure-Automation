---
# ==============================================================================
# PLAYBOOK: olvm_vm_inventory.yml
# ==============================================================================
# Operational Category: Infrastructure Inventory
# Safety Classification: READ_ONLY
# Supported Platforms: Oracle Linux Virtualization Manager (OLVM 4.4, 4.5) / oVirt 4.x
# Verified Modules (FQCN):
#   - ansible.builtin.uri
#   - ansible.builtin.file
#   - ansible.builtin.copy
#   - ansible.builtin.debug
# ==============================================================================

- name: OLVM Virtual Machine Detailed Inventory Audit
  hosts: virtualization_managers:olvm_infrastructure
  gather_facts: false
  vars_files:
    - ../../vars/global.yml
    - ../../vars/olvm.yml

  vars:
    engine_url: "{{ olvm_engine_url | default('https://192.168.242.133/ovirt-engine/api') }}"
    engine_user: "{{ olvm_user | default('admin@internal') }}"
    engine_password: "{{ olvm_pass | default('Unknown@56') }}"

  tasks:
    - name: 1. Query Virtual Machines from OLVM Engine
      ansible.builtin.uri:
        url: "{{ engine_url }}/vms"
        method: GET
        user: "{{ engine_user }}"
        password: "{{ engine_password }}"
        validate_certs: false
        force_basic_auth: true
        headers:
          Accept: "application/json"
        status_code: [200, 401, 403]
        return_content: true
      register: olvm_vms_raw
      ignore_errors: true

    - name: 2. Ensure Controller Inventory Directory Exists
      ansible.builtin.file:
        path: "{{ playbook_dir }}/../../reports/infrastructure-inventory/{{ inventory_hostname }}"
        state: directory
        mode: '0755'
      delegate_to: localhost

    - name: 3. Save OLVM VM Inventory Artifact
      ansible.builtin.copy:
        content: |
          === OLVM VIRTUAL MACHINE INVENTORY: {{ inventory_hostname }} ===
          Engine Endpoint: {{ engine_url }}
          
          --- DISCOVERED VMS ---
          {{ olvm_vms_raw.json | default(olvm_vms_raw.content | default('Failed to query VMs endpoint')) }}
        dest: "{{ playbook_dir }}/../../reports/infrastructure-inventory/{{ inventory_hostname }}/olvm_vm_inventory.txt"
        mode: '0644'
      delegate_to: localhost

    - name: 4. Display VM Inventory Status
      ansible.builtin.debug:
        msg: "OLVM VM Inventory query complete for {{ inventory_hostname }}."
