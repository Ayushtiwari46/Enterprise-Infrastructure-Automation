---
# ==============================================================================
# OPERATIONAL PLAYBOOK: OLVM / OVIRT AUDIT LOGS & SYSTEM EVENTS INGESTION
# ==============================================================================
# Framework: Enterprise Infrastructure Automation Framework
# Classification: READ_ONLY / AUDIT_LOGS
# Scope: REST API event logs, warning/error event codes, host fencing, VM crashes
# ==============================================================================

- name: OLVM Cluster Events & System Audit Logs Ingestion
  hosts: olvm_engine
  gather_facts: false
  vars_files:
    - ../../vars/global.yml
    - ../../vars/olvm.yml

  vars:
    report_dir: "{{ playbook_dir }}/../../reports/configuration-audits/{{ inventory_hostname }}"

  tasks:
    - name: "1. Ensure Audit Directory Exists on Controller"
      ansible.builtin.file:
        path: "{{ report_dir }}"
        state: directory
        mode: '0755'
      delegate_to: localhost

    - name: "2. Query Recent Cluster Warning & Error Events via REST API"
      ovirt.ovirt.ovirt_event_info:
        auth:
          url: "{{ olvm_engine_url }}"
          username: "{{ olvm_engine_username }}"
          password: "{{ olvm_engine_password }}"
          insecure: "{{ not olvm_validate_certs }}"
        query: "severity=warning or severity=error"
      register: events_info
      delegate_to: localhost
      ignore_errors: true

    - name: "3. Query Engine Database for Recent Audit Log Records"
      ansible.builtin.shell: |
        if command -v su >/dev/null 2>&1; then
          su - postgres -c "psql -d engine -c 'SELECT log_time, severity, message FROM audit_log ORDER BY audit_log_id DESC LIMIT 50;' 2>/dev/null" || true
        else
          echo "Database CLI unavailable"
        fi
      register: audit_log_db
      changed_when: false

    - name: "4. Query Fencing & Host Non-Operational Events"
      ansible.builtin.shell: |
        if command -v su >/dev/null 2>&1; then
          su - postgres -c "psql -d engine -c 'SELECT log_time, vds_name, message FROM audit_log WHERE log_type IN (501, 502, 503, 504, 505) ORDER BY audit_log_id DESC LIMIT 20;' 2>/dev/null" || echo "No fencing events recorded"
        else
          echo "Database query unavailable"
        fi
      register: fencing_events_db
      changed_when: false

    - name: "5. Save OLVM Event Log Audit Report on Controller"
      ansible.builtin.copy:
        content: |
          ==============================================================================
          OLVM / OVIRT CLUSTER AUDIT LOGS & CRITICAL EVENTS REPORT
          ==============================================================================
          Target Engine     : {{ inventory_hostname }}
          Timestamp         : {{ ansible_date_time.iso8601 | default('2026-11-20T03:25:00') }}
          ==============================================================================

          --- 1. TOP 50 RECENT AUDIT LOG EVENTS (DATABASE) ---
          {{ audit_log_db.stdout }}

          --- 2. HOST FENCING & NON-OPERATIONAL EVENT HISTORY ---
          {{ fencing_events_db.stdout }}
          ==============================================================================
        dest: "{{ report_dir }}/olvm_events_audit.txt"
        mode: '0644'
      delegate_to: localhost

    - name: "6. Display Events Audit Summary"
      ansible.builtin.debug:
        msg: "OLVM audit events report compiled. Report: {{ report_dir }}/olvm_events_audit.txt"
