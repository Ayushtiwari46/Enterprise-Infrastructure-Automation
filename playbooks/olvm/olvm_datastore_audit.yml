---
# ==============================================================================
# PLAYBOOK: olvm_datastore_audit.yml
# ==============================================================================
# Operational Category: Configuration Audits
# Safety Classification: CONFIGURATION_AUDIT
# Supported Platforms: Oracle Linux Virtualization Manager (OLVM 4.4, 4.5) / oVirt 4.x
# Verified Modules (FQCN):
#   - ansible.builtin.uri
#   - ansible.builtin.file
#   - ansible.builtin.copy
#   - ansible.builtin.debug
# ==============================================================================

- name: OLVM Storage Domain Capacity and Allocation Audit
  hosts: virtualization_managers:olvm_infrastructure
  gather_facts: false
  vars_files:
    - ../../vars/global.yml
    - ../../vars/olvm.yml

  vars:
    engine_url: "{{ olvm_engine_url | default('https://192.168.242.133/ovirt-engine/api') }}"
    engine_user: "{{ olvm_user | default('admin@internal') }}"
    engine_password: "{{ olvm_pass | default('Unknown@56') }}"

  tasks:
    - name: 1. Query Storage Domains via REST API
      ansible.builtin.uri:
        url: "{{ engine_url }}/storagedomains"
        method: GET
        user: "{{ engine_user }}"
        password: "{{ engine_password }}"
        validate_certs: false
        force_basic_auth: true
        headers:
          Accept: "application/json"
        status_code: [200, 401, 403]
        return_content: true
      register: olvm_storage_raw
      ignore_errors: true

    - name: 2. Ensure Controller Audit Directory Exists
      ansible.builtin.file:
        path: "{{ playbook_dir }}/../../reports/configuration-audits/{{ inventory_hostname }}"
        state: directory
        mode: '0755'
      delegate_to: localhost

    - name: 3. Save Storage Domain Audit Artifact
      ansible.builtin.copy:
        content: |
          === OLVM STORAGE DOMAIN AUDIT: {{ inventory_hostname }} ===
          Engine Endpoint: {{ engine_url }}
          
          --- STORAGE DOMAINS (NFS / iSCSI / FC) ---
          {{ olvm_storage_raw.json | default(olvm_storage_raw.content | default('Failed to query storagedomains endpoint')) }}
        dest: "{{ playbook_dir }}/../../reports/configuration-audits/{{ inventory_hostname }}/olvm_storage_audit.txt"
        mode: '0644'
      delegate_to: localhost

    - name: 4. Display Storage Domain Audit Status
      ansible.builtin.debug:
        msg: "OLVM Storage Domain audit complete for {{ inventory_hostname }}."
