---
# ==============================================================================
# PLAYBOOK: olvm_snapshot_inventory.yml
# ==============================================================================
# Operational Category: Configuration Audits
# Safety Classification: CONFIGURATION_AUDIT
# Supported Platforms: Oracle Linux Virtualization Manager (OLVM 4.4, 4.5) / oVirt 4.x
# Verified Modules (FQCN):
#   - ansible.builtin.uri
#   - ansible.builtin.file
#   - ansible.builtin.copy
#   - ansible.builtin.debug
# ==============================================================================

- name: OLVM Virtual Machine Snapshot and Storage Lease Audit
  hosts: virtualization_managers:olvm_infrastructure
  gather_facts: false
  vars_files:
    - ../../vars/global.yml
    - ../../vars/olvm.yml

  vars:
    engine_url: "{{ olvm_engine_url | default('https://192.168.242.133/ovirt-engine/api') }}"
    engine_user: "{{ olvm_user | default('admin@internal') }}"
    engine_password: "{{ olvm_pass | default('Unknown@56') }}"

  tasks:
    - name: 1. Query Virtual Machines List to Identify Disks and Snapshots
      ansible.builtin.uri:
        url: "{{ engine_url }}/vms"
        method: GET
        user: "{{ engine_user }}"
        password: "{{ engine_password }}"
        validate_certs: false
        force_basic_auth: true
        headers:
          Accept: "application/json"
        status_code: [200, 401, 403]
        return_content: true
      register: vm_list
      ignore_errors: true

    - name: 2. Query Storage Domain Disks
      ansible.builtin.uri:
        url: "{{ engine_url }}/disks"
        method: GET
        user: "{{ engine_user }}"
        password: "{{ engine_password }}"
        validate_certs: false
        force_basic_auth: true
        headers:
          Accept: "application/json"
        status_code: [200, 401, 403]
        return_content: true
      register: olvm_disks
      ignore_errors: true

    - name: 3. Ensure Controller Audit Directory Exists
      ansible.builtin.file:
        path: "{{ playbook_dir }}/../../reports/configuration-audits/{{ inventory_hostname }}"
        state: directory
        mode: '0755'
      delegate_to: localhost

    - name: 4. Save OLVM Snapshot and Disk Audit Artifact
      ansible.builtin.copy:
        content: |
          === OLVM SNAPSHOT & DISK AUDIT: {{ inventory_hostname }} ===
          Engine Endpoint: {{ engine_url }}
          
          --- DISK LEASES AND STORAGE IMAGES ---
          {{ olvm_disks.json | default(olvm_disks.content | default('Failed to query disks endpoint')) }}
        dest: "{{ playbook_dir }}/../../reports/configuration-audits/{{ inventory_hostname }}/olvm_snapshot_audit.txt"
        mode: '0644'
      delegate_to: localhost

    - name: 5. Display Snapshot Audit Status
      ansible.builtin.debug:
        msg: "OLVM snapshot and disk audit complete for {{ inventory_hostname }}."
