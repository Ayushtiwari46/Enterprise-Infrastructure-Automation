---
# ==============================================================================
# PLAYBOOK: terraform_state_inventory.yml
# ==============================================================================
# Operational Category: Infrastructure Inventory
# Safety Classification: READ_ONLY
# Supported Platforms: Terraform CLI 1.x+
# Verified Modules (FQCN):
#   - ansible.builtin.command
#   - ansible.builtin.stat
#   - ansible.builtin.file
#   - ansible.builtin.copy
#   - ansible.builtin.debug
# ==============================================================================

- name: Terraform Managed Resource State Inventory and Drift Audit
  hosts: control_nodes:localhost
  gather_facts: false
  vars_files:
    - ../../vars/global.yml

  vars:
    tf_workspace_dir: "{{ terraform_dir | default('/root/Infrastructure-Automation') }}"

  tasks:
    - name: 1. Verify Terraform Binary
      ansible.builtin.command:
        cmd: which terraform
      register: tf_which
      changed_when: false
      failed_when: false

    - name: 2. Query Managed Resource List (terraform state list)
      ansible.builtin.command:
        cmd: terraform state list
        chdir: "{{ tf_workspace_dir }}"
      register: tf_state_list
      changed_when: false
      failed_when: false
      when: tf_which.rc == 0

    - name: 3. Audit Local State File (terraform.tfstate)
      ansible.builtin.stat:
        path: "{{ tf_workspace_dir }}/terraform.tfstate"
      register: tfstate_file_stat

    - name: 4. Ensure Controller Inventory Directory Exists
      ansible.builtin.file:
        path: "{{ playbook_dir }}/../../reports/infrastructure-inventory/{{ inventory_hostname }}"
        state: directory
        mode: '0755'
      delegate_to: localhost

    - name: 5. Save State Inventory Artifact
      ansible.builtin.copy:
        content: |
          === TERRAFORM STATE RESOURCE INVENTORY: {{ inventory_hostname }} ===
          Local State File Exists: {{ tfstate_file_stat.stat.exists }}
          State File Size (bytes): {{ tfstate_file_stat.stat.size | default(0) }}
          
          --- MANAGED RESOURCE INVENTORY (terraform state list) ---
          Total Resources: {{ tf_state_list.stdout_lines | default([]) | length }}
          {{ tf_state_list.stdout | default('No resources tracked in state or terraform not installed') }}
        dest: "{{ playbook_dir }}/../../reports/infrastructure-inventory/{{ inventory_hostname }}/terraform_state_inventory.txt"
        mode: '0644'
      delegate_to: localhost

    - name: 6. Display State Inventory Status
      ansible.builtin.debug:
        msg: "Terraform state inventory complete on {{ inventory_hostname }}. Managed resources: {{ tf_state_list.stdout_lines | default([]) | length }}"
