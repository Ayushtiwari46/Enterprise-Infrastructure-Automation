---
# ==============================================================================
# PLAYBOOK: terraform_environment_validation.yml
# ==============================================================================
# Operational Category: Configuration Audits
# Safety Classification: CONFIGURATION_AUDIT
# Supported Platforms: Terraform CLI 1.x+ on Linux / Controller
# Verified Modules (FQCN):
#   - ansible.builtin.command
#   - ansible.builtin.stat
#   - ansible.builtin.file
#   - ansible.builtin.copy
#   - ansible.builtin.debug
# ==============================================================================

- name: Terraform Workspace Environment, Provider Lock, and Backend Validation
  hosts: control_nodes:localhost
  gather_facts: false
  vars_files:
    - ../../vars/global.yml

  vars:
    tf_workspace_dir: "{{ terraform_dir | default('/root/Infrastructure-Automation') }}"

  tasks:
    - name: 1. Verify Terraform CLI Binary
      ansible.builtin.command:
        cmd: which terraform
      register: tf_which
      changed_when: false
      failed_when: false

    - name: 2. Query Terraform Version and Core Release
      ansible.builtin.command:
        cmd: terraform version -json
      register: tf_version_json
      changed_when: false
      failed_when: false
      when: tf_which.rc == 0

    - name: 3. Audit Terraform Dependency Lock File (.terraform.lock.hcl)
      ansible.builtin.stat:
        path: "{{ tf_workspace_dir }}/.terraform.lock.hcl"
      register: lock_file_stat

    - name: 4. Audit Hidden Terraform Initialization Cache (.terraform)
      ansible.builtin.stat:
        path: "{{ tf_workspace_dir }}/.terraform"
      register: terraform_dir_stat

    - name: 5. Ensure Controller Audit Directory Exists
      ansible.builtin.file:
        path: "{{ playbook_dir }}/../../reports/configuration-audits/{{ inventory_hostname }}"
        state: directory
        mode: '0755'
      delegate_to: localhost

    - name: 6. Save Terraform Environment Validation Artifact
      ansible.builtin.copy:
        content: |
          === TERRAFORM ENVIRONMENT VALIDATION: {{ inventory_hostname }} ===
          Workspace Directory: {{ tf_workspace_dir }}
          Terraform CLI Available: {{ tf_which.rc == 0 }}
          
          --- TERRAFORM CORE VERSION ---
          {{ tf_version_json.stdout | default('Terraform binary not present in PATH') }}
          
          --- PROVIDER LOCK STATUS ---
          Lock File Exists (.terraform.lock.hcl): {{ lock_file_stat.stat.exists }}
          Initialization Directory Exists (.terraform): {{ terraform_dir_stat.stat.exists }}
        dest: "{{ playbook_dir }}/../../reports/configuration-audits/{{ inventory_hostname }}/terraform_env_validation.txt"
        mode: '0644'
      delegate_to: localhost

    - name: 7. Display Terraform Validation Status
      ansible.builtin.debug:
        msg: "Terraform environment validation complete on {{ inventory_hostname }}."
