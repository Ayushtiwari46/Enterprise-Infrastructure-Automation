---
# ==============================================================================
# INCIDENT EVIDENCE COLLECTION ENGINE: MICROSOFT WINDOWS
# ==============================================================================
# Safety Classification: READ_ONLY / FORENSIC_ACQUISITION
# Supported OS: Windows Server 2012 R2, 2016, 2019, 2022, 2025
# ==============================================================================

- name: Microsoft Windows Incident Evidence Acquisition Engine
  hosts: windows_enterprise:mock_windows
  gather_facts: false
  vars_files:
    - ../../vars/global.yml
    - ../../vars/windows.yml

  vars:
    case_id: "{{ case_number | default('INC0012345') }}"
    customer_id: "{{ customer_name | default('INTERNAL-LAB') }}"
    collection_mode: "{{ mode | default('MODE_1') }}"
    n_days: "{{ days | default(7) | int }}"

  tasks:
    - name: 0. Initialize Immutable Incident Evidence Session Context
      ansible.builtin.set_fact:
        session_ts: "{{ session_id | default(lookup('pipe', 'date +%Y%m%d_%H%M%S')) }}"

    - name: 0b. Initialize Immutable Evidence Vault Path
      ansible.builtin.set_fact:
        vault_base: "{{ playbook_dir }}/../../case-output/{{ case_id }}/session_{{ session_ts }}"

    - name: 1. Ensure Local Vault Directories Exist on Controller
      ansible.builtin.file:
        path: "{{ vault_base }}/{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - case-details
        - windows/{{ inventory_hostname }}
        - reports
        - manifests
      delegate_to: localhost

    - name: 2. Ensure Remote Temporary Staging Exists on Windows Host
      ansible.windows.win_shell: |
        $path = 'C:\Temp\CaseEvidence_{{ case_id }}'
        if (!(Test-Path $path)) { New-Item -ItemType Directory -Path $path -Force | Out-Null }

    - name: 3. Export System and Application Event Logs to CSV
      ansible.windows.win_shell: |
        $start = (Get-Date).AddDays(-{{ n_days }})
        Get-WinEvent -FilterHashtable @{LogName='System'; Level=1,2,3; StartTime=$start} -MaxEvents 1000 -ErrorAction SilentlyContinue |
            Select-Object TimeCreated, Id, LevelDisplayName, ProviderName, Message |
            Export-Csv -Path 'C:\Temp\CaseEvidence_{{ case_id }}\System_Errors.csv' -NoTypeInformation -Encoding UTF8
        Get-WinEvent -FilterHashtable @{LogName='Application'; Level=1,2; StartTime=$start} -MaxEvents 1000 -ErrorAction SilentlyContinue |
            Select-Object TimeCreated, Id, LevelDisplayName, ProviderName, Message |
            Export-Csv -Path 'C:\Temp\CaseEvidence_{{ case_id }}\Application_Errors.csv' -NoTypeInformation -Encoding UTF8

    - name: 4. Export Process and Network State
      ansible.windows.win_shell: |
        Get-Process | Sort-Object -Property WorkingSet64 -Descending | Select-Object -First 30 Name, Id, WorkingSet64, CPU, Handles |
            Export-Csv -Path 'C:\Temp\CaseEvidence_{{ case_id }}\Top_Processes.csv' -NoTypeInformation -Encoding UTF8
        Get-NetTCPConnection | Where-Object { $_.State -eq 'Listen' } | Select-Object LocalAddress, LocalPort, OwningProcess |
            Export-Csv -Path 'C:\Temp\CaseEvidence_{{ case_id }}\Listening_Ports.csv' -NoTypeInformation -Encoding UTF8

    - name: 5. Fetch Windows Evidence Files to Controller Vault
      ansible.builtin.fetch:
        src: "C:\\Temp\\CaseEvidence_{{ case_id }}\\{{ item }}"
        dest: "{{ vault_base }}/windows/{{ inventory_hostname }}/"
        flat: true
      loop:
        - System_Errors.csv
        - Application_Errors.csv
        - Top_Processes.csv
        - Listening_Ports.csv

    - name: 6. Generate SHA-256 Checksum Manifest on Controller
      ansible.builtin.shell: |
        cd {{ vault_base }} && find . -type f ! -name "*.sha256" -exec sha256sum {} + > manifests/manifest_{{ inventory_hostname }}.sha256
      delegate_to: localhost
      changed_when: false

    - name: 7. Display Windows Evidence Status
      ansible.builtin.debug:
        msg: "Windows evidence collection complete for {{ inventory_hostname }}. Preserved in {{ vault_base }}/"
