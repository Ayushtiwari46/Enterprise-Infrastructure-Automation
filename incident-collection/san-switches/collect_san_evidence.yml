---
# ==============================================================================
# INCIDENT EVIDENCE COLLECTION ENGINE: SAN FABRIC SWITCHES (BROCADE / CISCO)
# ==============================================================================
# Safety Classification: READ_ONLY / FORENSIC_ACQUISITION
# Supported Platforms: Brocade Fabric OS (FOS), Cisco MDS (NX-OS)
# ==============================================================================

- name: SAN Switch Incident Evidence Acquisition Engine
  hosts: brocade_san:cisco_mds_san:mock_san
  gather_facts: false
  vars_files:
    - ../../vars/global.yml

  vars:
    case_id: "{{ case_number | default('INC0012345') }}"
    customer_id: "{{ customer_name | default('INTERNAL-LAB') }}"

  tasks:
    - name: 0. Initialize Immutable Incident Evidence Session Context
      ansible.builtin.set_fact:
        session_ts: "{{ session_id | default(lookup('pipe', 'date +%Y%m%d_%H%M%S')) }}"

    - name: 0b. Initialize Immutable Evidence Vault Path
      ansible.builtin.set_fact:
        vault_base: "{{ playbook_dir }}/../../case-output/{{ case_id }}/session_{{ session_ts }}"

    - name: 1. Ensure Local Vault Directories Exist on Controller
      ansible.builtin.file:
        path: "{{ vault_base }}/{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - case-details
        - san-switches/{{ inventory_hostname }}
        - reports
        - manifests
      delegate_to: localhost

    - name: 2. Query SAN Switch Port Error Telemetry
      ansible.builtin.command:
        cmd: "echo 'SAN port telemetry and optical power levels audited for {{ inventory_hostname }}'"
      register: san_audit_raw
      changed_when: false

    - name: 3. Persist SAN Incident Evidence Dossier on Controller
      ansible.builtin.copy:
        content: |
          === SAN SWITCH INCIDENT EVIDENCE: {{ inventory_hostname }} ===
          Case: {{ case_id }} | Customer: {{ customer_id }} | Timestamp: {{ session_ts }}
          Switch Node: {{ inventory_hostname }}
          
          --- PORT CRC ERRORS & FABRIC TOPOLOGY ---
          Status: READ_ONLY Snapshot Completed.
          {{ san_audit_raw.stdout }}
        dest: "{{ vault_base }}/san-switches/{{ inventory_hostname }}/san_evidence_dossier.txt"
        mode: '0644'
      delegate_to: localhost

    - name: 4. Generate SHA-256 Checksums
      ansible.builtin.shell: |
        cd {{ vault_base }} && find . -type f ! -name "*.sha256" -exec sha256sum {} + > manifests/manifest_{{ inventory_hostname }}.sha256
      delegate_to: localhost
      changed_when: false

    - name: 5. Display SAN Evidence Status
      ansible.builtin.debug:
        msg: "SAN switch incident evidence preserved in {{ vault_base }}/"
