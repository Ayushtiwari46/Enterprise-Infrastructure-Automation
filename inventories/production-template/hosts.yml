# ==============================================================================
# ENTERPRISE INFRASTRUCTURE PRODUCTION TEMPLATE INVENTORY
# ==============================================================================
# Enterprise-wide multi-technology inventory template.
# Designed for L3 Operations across heterogeneous data centers.
# ==============================================================================

all:
  vars:
    ansible_connection: ssh
    ansible_port: 22
    ansible_user: "svc_ansible_ops"
    ansible_ssh_private_key_file: "~/.ssh/id_rsa_ops"
    ansible_python_interpreter: "/usr/bin/python3"
    environment_tier: "production"
    change_management_approver: "CAB-INFRA"

  children:
    # --------------------------------------------------------------------------
    # 1. LINUX ENTERPRISE INFRASTRUCTURE
    # --------------------------------------------------------------------------
    linux_enterprise:
      children:
        rhel_fleet:
          hosts:
            prdrehl01.corp.internal: { ansible_host: 10.100.10.11, os_release: "8.9" }
            prdrehl02.corp.internal: { ansible_host: 10.100.10.12, os_release: "9.3" }
        sles_fleet:
          hosts:
            prdsles01.corp.internal: { ansible_host: 10.100.20.11, os_release: "15-SP4" }
        oracle_linux_fleet:
          hosts:
            prdol01.corp.internal: { ansible_host: 10.100.30.11, os_release: "8.10" }
        ubuntu_fleet:
          hosts:
            prdubu01.corp.internal: { ansible_host: 10.100.40.11, os_release: "22.04" }

    # --------------------------------------------------------------------------
    # 2. IBM AIX ENTERPRISE INFRASTRUCTURE
    # --------------------------------------------------------------------------
    aix_enterprise:
      vars:
        ansible_python_interpreter: "/opt/freeware/bin/python3"
      children:
        aix_power8:
          hosts:
            prdaix01.corp.internal: { ansible_host: 10.100.50.11, aix_version: "7.2-TL05" }
        aix_power9:
          hosts:
            prdaix02.corp.internal: { ansible_host: 10.100.50.12, aix_version: "7.3-TL01" }

    # --------------------------------------------------------------------------
    # 3. MICROSOFT WINDOWS SERVER INFRASTRUCTURE
    # --------------------------------------------------------------------------
    windows_enterprise:
      vars:
        ansible_connection: winrm
        ansible_winrm_transport: ntlm
        ansible_winrm_server_cert_validation: ignore
        ansible_port: 5986
      children:
        win_srv2019:
          hosts:
            prdwin01.corp.internal: { ansible_host: 10.100.60.11 }
        win_srv2022:
          hosts:
            prdwin02.corp.internal: { ansible_host: 10.100.60.12 }

    # --------------------------------------------------------------------------
    # 4. VIRTUALIZATION INFRASTRUCTURE
    # --------------------------------------------------------------------------
    virtualization_enterprise:
      children:
        vmware_vcenter:
          hosts:
            prdvcenter01.corp.internal:
              ansible_host: 10.100.70.10
              ansible_connection: local
              vcenter_hostname: "prdvcenter01.corp.internal"
        vmware_esxi:
          hosts:
            prdesxi01.corp.internal: { ansible_host: 10.100.70.21 }
            prdesxi02.corp.internal: { ansible_host: 10.100.70.22 }
        olvm_infrastructure:
          hosts:
            prdolvm01.corp.internal:
              ansible_host: 10.100.75.10
              ansible_connection: local
              olvm_engine_fqdn: "prdolvm01.corp.internal"
        olvm_engine:
          hosts:
            prdolvm01.corp.internal:
        kvm_hypervisors:
          hosts:
            prdkvm01.corp.internal: { ansible_host: 10.100.75.21 }
            prdkvm02.corp.internal: { ansible_host: 10.100.75.22 }

    # --------------------------------------------------------------------------
    # 5. STORAGE & SAN FABRIC INFRASTRUCTURE
    # --------------------------------------------------------------------------
    storage_enterprise:
      vars:
        ansible_connection: local
      children:
        ibm_storage:
          hosts:
            prdibmsvc01.corp.internal: { ansible_host: 10.100.80.11, storage_model: "FlashSystem 9200" }
        hpe_storage:
          hosts:
            prdhpe3par01.corp.internal: { ansible_host: 10.100.80.21, storage_model: "Primera 600" }
        dell_storage:
          hosts:
            prddellps01.corp.internal: { ansible_host: 10.100.80.31, storage_model: "PowerStore 5000T" }
        brocade_san:
          hosts:
            prdsansw01.corp.internal: { ansible_host: 10.100.85.11, fabric_role: "Core-A" }
            prdsansw02.corp.internal: { ansible_host: 10.100.85.12, fabric_role: "Core-B" }
        cisco_mds_san:
          hosts:
            prdmdssw01.corp.internal: { ansible_host: 10.100.85.21, fabric_role: "VSAN-100" }

    # --------------------------------------------------------------------------
    # 6. HIGH-AVAILABILITY CLUSTERING
    # --------------------------------------------------------------------------
    clustering_enterprise:
      children:
        powerha_nodes:
          hosts:
            prdpha01.corp.internal: { ansible_host: 10.100.90.11, cluster_name: "PHA_ORACLE_CL" }
            prdpha02.corp.internal: { ansible_host: 10.100.90.12, cluster_name: "PHA_ORACLE_CL" }
        gpfs_nodes:
          hosts:
            prdgpfs01.corp.internal: { ansible_host: 10.100.90.21, cluster_name: "SCALE_PRD_CL" }
            prdgpfs02.corp.internal: { ansible_host: 10.100.90.22, cluster_name: "SCALE_PRD_CL" }
        veritas_vcs_nodes:
          hosts:
            prdvcs01.corp.internal: { ansible_host: 10.100.90.31, cluster_name: "VCS_SAP_CL" }
            prdvcs02.corp.internal: { ansible_host: 10.100.90.32, cluster_name: "VCS_SAP_CL" }

    # --------------------------------------------------------------------------
    # 7. BACKUP & DISASTER RECOVERY
    # --------------------------------------------------------------------------
    backup_enterprise:
      children:
        spectrum_protect_nodes:
          hosts:
            prdtsm01.corp.internal: { ansible_host: 10.100.95.11 }
        netbackup_nodes:
          hosts:
            prdnbu01.corp.internal: { ansible_host: 10.100.95.21 }
        networker_nodes:
          hosts:
            prdnwk01.corp.internal: { ansible_host: 10.100.95.31 }
