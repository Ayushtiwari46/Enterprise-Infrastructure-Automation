# ==============================================================================
# ENTERPRISE INFRASTRUCTURE LAB INVENTORY
# ==============================================================================
# Target Environment: VMware Subnet 192.168.242.0/24 Lab Cluster
# Nodes: Ansible Controller + NFS, OLVM Engine, KVM Hypervisor 1 & 2
# ==============================================================================

all:
  vars:
    ansible_user: root
    ansible_ssh_private_key_file: /root/.ssh/id_rsa
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no'
    ansible_python_interpreter: /usr/bin/python3
    env_name: "enterprise-lab"
    datacenter: "lab-dc1"

  children:
    # --------------------------------------------------------------------------
    # Linux Operating System Hierarchy
    # --------------------------------------------------------------------------
    linux_all:
      children:
        oracle_linux:
          hosts:
            ansible-nfs.lab.local:
              ansible_host: 192.168.242.132
              node_role: "ansible-controller-nfs"
            olvm-engine.lab.local:
              ansible_host: 192.168.242.133
              node_role: "olvm-engine"
            kvm-host-1.lab.local:
              ansible_host: 192.168.242.134
              node_role: "kvm-hypervisor-node1"
            kvm-host-2.lab.local:
              ansible_host: 192.168.242.135
              node_role: "kvm-hypervisor-node2"

    # --------------------------------------------------------------------------
    # Functional / Service Roles
    # --------------------------------------------------------------------------
    control_nodes:
      hosts:
        ansible-nfs.lab.local:

    nfs_storage_servers:
      hosts:
        ansible-nfs.lab.local:
          nfs_exports:
            - /export/cluster-logs
            - /export/olvm-data
            - /export/olvm-iso

    virtualization_managers:
      hosts:
        olvm-engine.lab.local:
          olvm_api_port: 443
          olvm_fqdn: "olvm-engine.lab.local"

    olvm_engine:
      hosts:
        olvm-engine.lab.local:

    kvm_hypervisors:
      hosts:
        kvm-host-1.lab.local:
          hypervisor_index: 1
        kvm-host-2.lab.local:
          hypervisor_index: 2

    # --------------------------------------------------------------------------
    # Synthetic / Mock Groups for Multi-platform Playbook Testing
    # --------------------------------------------------------------------------
    mock_targets:
      children:
        mock_aix:
          hosts:
            mock-aix-p9-01.lab.local:
              ansible_host: 127.0.0.1
              ansible_connection: local
              os_family: "AIX"
        mock_windows:
          hosts:
            mock-win-srv2022.lab.local:
              ansible_host: 127.0.0.1
              ansible_connection: local
              os_family: "Windows"
        mock_vmware:
          hosts:
            mock-vcenter7.lab.local:
              ansible_host: 127.0.0.1
              ansible_connection: local
              platform: "VMware"
        mock_storage:
          hosts:
            mock-ibm-flashsystem.lab.local:
              ansible_host: 127.0.0.1
              ansible_connection: local
              vendor: "IBM"
            mock-hpe-primera.lab.local:
              ansible_host: 127.0.0.1
              ansible_connection: local
              vendor: "HPE"
            mock-dell-powerstore.lab.local:
              ansible_host: 127.0.0.1
              ansible_connection: local
              vendor: "Dell"
        mock_san:
          hosts:
            mock-brocade-switch.lab.local:
              ansible_host: 127.0.0.1
              ansible_connection: local
              vendor: "Brocade"
            mock-cisco-mds.lab.local:
              ansible_host: 127.0.0.1
              ansible_connection: local
              vendor: "Cisco"
