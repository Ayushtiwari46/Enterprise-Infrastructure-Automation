---
# ==============================================================================
# ENTERPRISE INFRASTRUCTURE ANSIBLE GALAXY COLLECTIONS MANIFEST
# ==============================================================================
# All collections verified for compatibility with Ansible Core 2.16.x & Python 3.12
# ==============================================================================

collections:
  # Linux & Unix POSIX Operations
  - name: ansible.posix
    version: ">=1.5.4"

  # Core System Administration, Storage, AIX, and Backup Utilities
  - name: community.general
    version: ">=8.0.0"

  # VMware vSphere & ESXi Hypervisor Management
  - name: community.vmware
    version: ">=4.0.0"

  # Oracle Linux Virtualization Manager (OLVM) / oVirt Engine Management
  - name: ovirt.ovirt
    version: ">=3.1.0"

  # Cisco MDS SAN Switch / NX-OS Fabric Management
  - name: cisco.nxos
    version: ">=6.0.0"

  # Microsoft Windows Server Management
  - name: ansible.windows
    version: ">=2.0.0"

  - name: community.windows
    version: ">=2.0.0"

  # IBM FlashSystem / SVC SAN Volume Controller Management
  - name: ibm.storage_virtualize
    version: ">=2.0.0"
